name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Verify locked dependencies
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --all-packages --group dev --group test --locked
      - name: Formatting
        run: make format-check
      - name: Lint
        run: make lint
      - name: Static type checking
        run: make typecheck
      - name: Unit tests and coverage
        run: make test
      - name: Pre-commit checks
        run: uv run pre-commit run --all-files

  local-development:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Build foundation image
        run: docker build -f docker/Dockerfile.foundation -t ask-david-foundation:ci .
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Start local development dependencies
        run: docker compose --env-file .env.example up --detach --wait
      - name: Show service status
        run: docker compose ps
      - name: Stop local development dependencies
        if: always()
        run: docker compose --env-file .env.example down

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - name: Install security tooling
        run: uv sync --all-packages --group dev --group test --locked
      - name: Source, dependency, and baseline secret checks
        run: make security
      - name: Git history secret scan
        uses: gitleaks/gitleaks-action@v2

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
      - uses: github/codeql-action/analyze@v3
