name: Terraform validation

on:
  pull_request:
    paths: ["infrastructure/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["infrastructure/**", ".github/workflows/terraform.yml"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      # v0.2.6 is pinned to its full known-safe commit after GHSA-69fq-xp46-6x23.
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514
        with:
          version: v0.69.3
      - name: Terraform formatting
        run: terraform fmt -check -recursive infrastructure
      - name: Bootstrap initialization without remote state
        run: terraform -chdir=infrastructure/bootstrap/state init -backend=false
      - name: Bootstrap validation
        run: terraform -chdir=infrastructure/bootstrap/state validate
      - name: Development initialization without remote state
        run: terraform -chdir=infrastructure/environments/development init -backend=false
      - name: Development validation
        run: terraform -chdir=infrastructure/environments/development validate
      - name: Terraform contract tests
        run: terraform -chdir=infrastructure/environments/development test -test-directory=tests
      - name: Terraform lint
        run: tflint --init --config "$GITHUB_WORKSPACE/infrastructure/.tflint.hcl" && tflint --chdir=infrastructure --recursive --config "$GITHUB_WORKSPACE/infrastructure/.tflint.hcl"
      - name: Static IaC security scan
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 infrastructure
