bundle:
  name: ask-david-goal-04-lakehouse

include:
  - bundles/goal_04_lakehouse/resources.yml
  - bundles/goal_05_ingestion/resources.yml
  - bundles/goal_06_doris/resources.yml
  - bundles/goal_07_retrieval/resources.yml

variables:
  warehouse_id:
    description: Existing approved Serverless SQL Warehouse ID.
  workflow_service_principal_application_id:
    description: Terraform-created workflow service-principal application ID.
  denied_service_principal_application_id:
    description: Terraform-created denied-test service-principal application ID.
  governance_admin_user_name:
    description: Existing development governance administrator for read-only lineage inspection.
  denied_s3_probe_url:
    description: Terraform-derived approved managed-storage prefix for the negative path test.
  catalog_name:
    description: Terraform-created development catalog.
    default: ask_david_development
  goal5_structured_source_uri:
    description: Terraform-derived S3 URI for the neutral Goal 5 structured CSV.
  goal5_document_source_uri:
    description: Terraform-derived S3 URI for the neutral Goal 5 Markdown source.
  goal5_cdc_source_uri:
    description: Terraform-derived S3 URI for the neutral Goal 5 CDC JSONL batch.
  goal5_structured_contract_version:
    description: Reviewed structured contract version.
    default: "1.0"
  goal5_document_contract_version:
    description: Reviewed document contract version.
    default: "1.0"
  goal5_cdc_contract_version:
    description: Reviewed CDC contract version.
    default: "1.0"
  goal6_increment_source_uri:
    description: Terraform-derived neutral Goal 6 increment CSV URI.
  goal7_collection_name:
    description: Terraform-derived single Goal 7 OpenSearch Serverless vector collection name.
  goal7_vector_index_name:
    description: Controlled Goal 7 vector index name.
    default: synthetic-document-chunks
  goal7_embedding_model_id:
    description: Canonical Databricks embedding model ID shared by index and query paths.
    default: databricks-gte-large-en
  goal7_embedding_dimension:
    description: Canonical embedding vector dimension.
    default: "1024"

run_as:
  service_principal_name: ${var.workflow_service_principal_application_id}

permissions:
  - user_name: ${var.governance_admin_user_name}
    level: CAN_MANAGE
  - group_name: ask-david-development-governance-admins
    level: CAN_MANAGE
  - group_name: ask-david-development-data-engineers
    level: CAN_RUN
  - service_principal_name: ${var.denied_service_principal_application_id}
    level: CAN_VIEW

sync:
  include:
    - sql/goal_04/*.sql
    - sql/goal_05/*.sql
    - sql/goal_06/*.sql
    - sql/goal_07/*.sql
  exclude:
    - sql/goal_04/remediation/**

targets:
  development:
    default: true
    mode: production
    workspace:
      root_path: /Workspace/Users/${var.governance_admin_user_name}/.bundle/${bundle.name}/${bundle.target}
