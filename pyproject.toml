[project]
name = "ask-david-workspace"
version = "0.1.0"
description = "Development workspace for the Ask D.A.V.I.D.-inspired data platform."
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "bandit[toml]>=1.8.0,<2.0.0",
  "detect-secrets>=1.5.0,<2.0.0",
  "mypy>=1.14.0,<2.0.0",
  "pip-audit>=2.8.0,<3.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "ruff>=0.8.0,<1.0.0",
]
test = [
  "pytest>=9.0.3,<10.0.0",
  "pytest-cov>=6.0.0,<7.0.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["packages/platform-foundation/src"]
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/platform-foundation/src"]
addopts = "-ra --strict-markers -m 'not integration and not cloud' --cov=ask_david_foundation --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=90"
markers = [
  "integration: tests requiring local services; excluded from the default test run.",
  "cloud: tests requiring cloud resources or credentials; excluded from the default test run.",
]

[tool.coverage.run]
branch = true
source = ["ask_david_foundation"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
targets = ["packages"]
exclude_dirs = ["tests"]
