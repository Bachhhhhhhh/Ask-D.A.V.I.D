services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ask_david_local
      POSTGRES_USER: local_developer
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U local_developer -d ask_david_local"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mockserver:
    image: mockserver/mockserver:5.15.0
    ports:
      - "127.0.0.1:1080:1080"

volumes:
  postgres-data:
